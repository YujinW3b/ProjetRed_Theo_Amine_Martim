<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Soutenance AUBEFER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#0B0812; --ink2:#120C1C; --surface:#1A1228; --surface2:#221735;
  --line:#2E2145; --line2:#3B2B57;
  --v1:#5F0087; --v2:#8700AF; --v3:#875FAF; --v4:#AF5FD7; --v5:#AF87FF; --v6:#D7AFFF;
  --ember:#FFAF00; --ember2:#D75F00; --blood:#C1272D; --moss:#6FBF6F; --gold:#D78700;
  --text:#CEC1E4; --muted:#8C7FAA; --dim:#6B5F86;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:'Oswald',var(--sans);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--text);
  font-family:var(--sans); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1100px 620px at 78% -8%, rgba(135,0,175,.26), transparent 62%),
    radial-gradient(760px 520px at 6% 104%, rgba(175,135,255,.13), transparent 64%);
}

/* ---------- deck ---------- */
#deck{position:fixed; inset:0; z-index:1}
.slide{
  position:absolute; inset:0; display:none;
  --u: min(1vw, 1.7778vh);
  padding: calc(var(--u)*4.6) calc(var(--u)*6) calc(var(--u)*7);
  flex-direction:column; justify-content:center; gap:calc(var(--u)*2.3); overflow:hidden;
}
.slide.is-active{display:flex}

/* ---------- type ---------- */
.eyebrow{
  font-family:var(--mono); font-size:calc(var(--u)*1.35); letter-spacing:.28em;
  text-transform:uppercase; color:var(--ember); margin:0;
}
h1{
  font-family:var(--disp); font-weight:700; font-size:calc(var(--u)*6.2);
  line-height:.98; letter-spacing:.01em; margin:0; color:#F3ECFF; text-wrap:balance;
}
h2{
  font-family:var(--disp); font-weight:600; font-size:calc(var(--u)*3.5);
  line-height:1.04; margin:0; color:#F3ECFF; text-wrap:balance; letter-spacing:.005em;
}
h3{
  font-family:var(--disp); font-weight:500; font-size:calc(var(--u)*1.72);
  line-height:1.2; margin:0; color:var(--v6); letter-spacing:.02em;
}
p{margin:0; font-size:calc(var(--u)*1.38); line-height:1.48; color:var(--text)}
.lede{font-size:calc(var(--u)*1.62); color:var(--text); max-width:78ch}
.muted{color:var(--muted)}
b,strong{color:#EFE6FF; font-weight:600}
ul{margin:0; padding-left:calc(var(--u)*1.8); font-size:calc(var(--u)*1.3); line-height:1.5; color:var(--text)}
li{margin-bottom:calc(var(--u)*.45)}
li::marker{color:var(--v4)}

/* ---------- blocks ---------- */
.row{display:flex; gap:calc(var(--u)*1.6); align-items:stretch; min-height:0}
.row>*{flex:1; min-width:0}
.card{
  min-width:0; background:linear-gradient(160deg, var(--surface), var(--ink2));
  border:1px solid var(--line); border-radius:calc(var(--u)*1.1);
  padding:calc(var(--u)*1.7); display:flex; flex-direction:column; gap:calc(var(--u)*.7);
}
.card.hot{border-color:rgba(255,175,0,.45); background:linear-gradient(160deg,#2A1B0E,#160F1E)}
.card.hot h3{color:var(--ember)}
.rule{height:1px; background:var(--line2); border:0; margin:0}

.stat{font-family:var(--disp); font-weight:700; font-size:calc(var(--u)*4.5); line-height:.9;
  color:var(--v5); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.stat.ember{color:var(--ember)} .stat.pale{color:#F3ECFF}

.kbd{font-family:var(--mono); font-size:.86em; background:var(--surface2);
  border:1px solid var(--line2); border-radius:.35em; padding:.1em .45em; color:var(--v6)}

/* ---------- terminal ---------- */
.term{
  font-family:var(--mono); font-size:calc(var(--u)*.94); line-height:1.38;
  background:#08060D; border:1px solid var(--line); border-radius:calc(var(--u)*.9);
  padding:calc(var(--u)*1.3) calc(var(--u)*1.5); margin:0; overflow:auto; min-width:0;
  white-space:pre; color:var(--text); box-shadow:inset 0 0 calc(var(--u)*5) rgba(135,0,175,.14);
}
.term .chrome{display:block; color:var(--dim); margin-bottom:calc(var(--u)*.9);
  font-size:calc(var(--u)*.98); letter-spacing:.04em}
.v1{color:var(--v1)} .v2{color:var(--v2)} .v3{color:var(--v3)}
.v4{color:var(--v4)} .v5{color:var(--v5)} .v6{color:var(--v6)}
.f1{color:var(--blood)} .f2{color:var(--ember2)} .f3{color:var(--ember)}
.gr{color:var(--moss)} .gy{color:#8787AF} .ye{color:var(--gold)} .rd{color:var(--blood)}
.bold{font-weight:700}
.cursor{display:inline-block; width:.62em; height:1.05em; vertical-align:-.18em;
  background:var(--v5); animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ---------- code ---------- */
.code{
  font-family:var(--mono); font-size:calc(var(--u)*.98); line-height:1.55;
  background:#0A0713; border:1px solid var(--line); border-radius:calc(var(--u)*.9);
  padding:calc(var(--u)*1.1) 0; margin:0; overflow:auto; min-width:0;
}
.code .ln{display:block; padding:0 calc(var(--u)*1.6); white-space:pre; color:#B7A9D2;
  border-left:calc(var(--u)*.28) solid transparent}
.code .ln.hl{background:rgba(175,135,255,.11); border-left-color:var(--v5)}
.code .ln.hl2{background:rgba(255,175,0,.10); border-left-color:var(--ember)}
.kw{color:#C792EA} .fn{color:#82AAFF} .str{color:#C3E88D} .num{color:#F78C6C}
.cm{color:#5F5478; font-style:italic} .ty{color:#FFCB6B} .op{color:#89DDFF}
.filename{font-family:var(--mono); font-size:calc(var(--u)*1.1); color:var(--dim);
  letter-spacing:.04em; margin:0 0 calc(var(--u)*.7)}

/* ---------- health bars ---------- */
.hp{display:flex; flex-direction:column; gap:calc(var(--u)*.35); font-family:var(--mono);
  font-size:calc(var(--u)*1.05)}
.hp .top{display:flex; justify-content:space-between; color:var(--text)}
.hp .nm{color:var(--text)}
.hp .track{display:block; height:calc(var(--u)*1.15); background:#17101F; border:1px solid var(--line2);
  border-radius:99px; overflow:hidden}
.hp .fill{display:block; height:100%; width:0; border-radius:99px; transition:width 1.1s cubic-bezier(.22,.9,.3,1)}
.hp .val{color:var(--muted); font-variant-numeric:tabular-nums}

/* ---------- steps ---------- */
.steps{display:flex; gap:calc(var(--u)*.9); align-items:stretch}
.step{flex:1; background:var(--surface); border:1px solid var(--line);
  border-radius:calc(var(--u)*1); padding:calc(var(--u)*1.3); min-width:0;
  display:flex; flex-direction:column; gap:calc(var(--u)*.6)}
.step .n{font-family:var(--mono); font-size:calc(var(--u)*1.1); color:var(--ember); letter-spacing:.14em}
.step.last{border-color:rgba(255,175,0,.42); background:linear-gradient(160deg,#2A1B0E,#160F1E)}
.arrow{display:flex; align-items:center; color:var(--v4); font-size:calc(var(--u)*2); flex:0 0 auto}

/* ---------- table ---------- */
table{border-collapse:collapse; width:100%; font-size:calc(var(--u)*1.24)}
th,td{text-align:left; padding:calc(var(--u)*.85) calc(var(--u)*1);
  border-bottom:1px solid var(--line); vertical-align:top}
th{font-family:var(--disp); font-weight:500; color:var(--v6); font-size:calc(var(--u)*1.24);
  letter-spacing:.03em}
tbody tr:nth-child(odd){background:rgba(255,255,255,.017)}

/* ---------- people ---------- */
.who{display:flex; flex-direction:column; gap:calc(var(--u)*1);
  background:var(--surface); border:1px solid var(--line); border-radius:calc(var(--u)*1);
  padding:calc(var(--u)*1.5); min-width:0; border-top:calc(var(--u)*.45) solid var(--v4)}
.who.a{border-top-color:var(--ember)} .who.m{border-top-color:var(--moss)}
.who .role{font-family:var(--mono); font-size:calc(var(--u)*1.05); color:var(--muted); letter-spacing:.1em; text-transform:uppercase}

/* ---------- banner ---------- */
.banner{font-family:var(--mono); font-weight:700; white-space:pre; margin:0;
  font-size:calc(var(--u)*1.24); letter-spacing:0}
.bn{display:block; line-height:1.02}
.term .banner{font-size:calc(var(--u)*.94)}

/* ---------- annexe tag ---------- */
.tag{display:inline-block; font-family:var(--mono); font-size:calc(var(--u)*1.05);
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink);
  background:var(--ember); padding:calc(var(--u)*.3) calc(var(--u)*.9);
  border-radius:calc(var(--u)*.3); font-weight:700}

/* ---------- HUD ---------- */
#hud{position:fixed; left:0; right:0; bottom:0; z-index:5; pointer-events:none;
  padding:0 calc(min(1vw,1.7778vh)*7) calc(min(1vw,1.7778vh)*2.2)}
#rail{height:2px; background:var(--line); border-radius:2px; overflow:hidden}
#railfill{height:100%; width:0; background:linear-gradient(90deg,var(--v2),var(--v5),var(--v6));
  transition:width .3s ease}
#hudrow{display:flex; justify-content:space-between; align-items:baseline;
  margin-top:calc(min(1vw,1.7778vh)*1); font-family:var(--mono);
  font-size:calc(min(1vw,1.7778vh)*1.05); color:var(--dim); letter-spacing:.1em}
#clock{font-variant-numeric:tabular-nums}
#right{display:flex; align-items:baseline; gap:calc(min(1vw,1.7778vh)*1.4)}
#who{color:var(--ember); font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  font-size:calc(min(1vw,1.7778vh)*1.55)}
#count{color:var(--dim)}
#clock.warn{color:var(--ember)} #clock.over{color:var(--blood)}
#help{opacity:0; transition:opacity .3s ease; position:fixed; right:calc(min(1vw,1.7778vh)*7); top:calc(min(1vw,1.7778vh)*3);
  z-index:5; font-family:var(--mono); font-size:calc(min(1vw,1.7778vh)*1.02);
  color:var(--dim); letter-spacing:.08em; text-align:right; line-height:1.7}
body.show-help #help{opacity:1}

/* ---------- jump menu ---------- */
#jump{position:fixed; inset:0; z-index:20; background:rgba(8,6,13,.96);
  display:none; padding:4vh 6vw; overflow:auto}
#jump.open{display:block}
#jump h2{margin-bottom:3vh}
#jump ol{list-style:none; padding:0; margin:0; display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px}
#jump button{width:100%; text-align:left; font-family:var(--sans); font-size:16px;
  background:var(--surface); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:12px 14px; cursor:pointer; display:flex; gap:12px}
#jump button:hover,#jump button:focus-visible{border-color:var(--v5); background:var(--surface2); outline:none}
#jump button .idx{font-family:var(--mono); color:var(--muted); min-width:2.2ch}
#jump button .who2{margin-left:auto; font-family:var(--mono); font-size:13px; color:var(--ember)}

/* ---------- entrance motion ---------- */
.slide.is-active > *{animation:rise .42s cubic-bezier(.2,.8,.3,1) both}
.slide.is-active > *:nth-child(1){animation-delay:.02s}
.slide.is-active > *:nth-child(2){animation-delay:.09s}
.slide.is-active > *:nth-child(3){animation-delay:.16s}
.slide.is-active > *:nth-child(4){animation-delay:.23s}
.slide.is-active > *:nth-child(5){animation-delay:.30s}
.slide.is-active > *:nth-child(6){animation-delay:.37s}
@keyframes rise{from{opacity:0; transform:translateY(calc(var(--u)*1.4))} to{opacity:1; transform:none}}

.reveal > *{opacity:0; animation:fadein .01s linear forwards}
.slide.is-active .reveal > *{animation:fadein .26s ease both; animation-delay:calc(var(--i,0)*55ms + .25s)}
@keyframes fadein{from{opacity:0} to{opacity:1}}

@media (prefers-reduced-motion: reduce){
  .slide.is-active > *, .slide.is-active .reveal > *{animation:none !important; opacity:1 !important; transform:none !important}
  .hp .fill{transition:none}
  .cursor{animation:none}
}

/* ---------- small screens ---------- */
@media (max-width:820px){
  body{overflow:auto}
  #deck{position:static}
  .slide{--u:3.1px; position:static; display:none; padding:24px 16px 90px; min-height:100vh}
  .slide.is-active{display:flex}
  h1{font-size:40px} h2{font-size:28px} h3{font-size:18px}
  p{font-size:15px} .lede{font-size:16px} ul{font-size:15px}
  .row,.steps{flex-direction:column}
  .arrow{transform:rotate(90deg); justify-content:center}
  .stat{font-size:40px}
  .term,.code{font-size:10px}
  .hp .nm{width:auto; min-width:11ch}
  #help{display:none}
  #hud{padding:0 16px 14px; background:linear-gradient(to top,var(--ink) 60%,transparent)}
}

/* ---------- print ---------- */
@media print{
  @page{size:A4 landscape; margin:0}
  html,body{height:auto; overflow:visible; background:#0B0812 !important}
  body::before{display:none}
  #hud,#help,#jump{display:none !important}
  #deck{position:static}
  .slide{position:static; display:flex !important; --u:11.2px;
    width:297mm; height:209mm; page-break-after:always; break-after:page;
    padding:14mm 16mm; background:#0B0812;
    -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .slide > *,.reveal > *{animation:none !important; opacity:1 !important; transform:none !important}
  .hp .fill{transition:none !important}
  .cursor{display:none}
}
</style></head><body>

{

<span style="--i:8">   Chargement du camp  [<span class="v5">####################</span>]</span>

<script>
(function(){

    b.innerHTML = '<span class="idx">' + (i+1) + '</span><span>' + s.nav + '</span><span class="who2">' + s.who + '</span>';
    b.addEventListener('click', () => { closeJump(); go(i); });
    li.appendChild(b); jumplist.appendChild(li);
  });

  let cur = 0, started = false, t0 = 0, tick = null;

  function fmt(ms){
    const t = Math.max(0, Math.floor(ms/1000));
    return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
  }
  function paintClock(){
    if (!started) { clockEl.textContent = '00:00'; return; }
    const ms = Date.now() - t0;
    clockEl.textContent = fmt(ms);
    clockEl.className = ms > 600000 ? 'over' : (ms > 480000 ? 'warn' : '');
  }
  function startClock(){
    if (started) return;
    started = true; t0 = Date.now();
    tick = setInterval(paintClock, 500); paintClock();
  }
  function resetClock(){
    started = false; if (tick) clearInterval(tick); tick = null; paintClock();
  }

  // --- per-slide animations ---
  function animateCounters(el){
    el.querySelectorAll('[data-count]').forEach(n => {
      const target = parseInt(n.dataset.count, 10);
      const suffix = n.dataset.suffix || '';
      if (reduce || target === 0) { n.textContent = target + suffix; return; }
      const dur = 750, s = performance.now();
      (function step(now){
        const p = Math.min(1, (now - s) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        n.textContent = Math.round(target * e) + suffix;
        if (p < 1) requestAnimationFrame(step);
      })(s);
    });
  }
  function animateBars(el){
    el.querySelectorAll('.hp .fill').forEach(f => {
      const w = f.dataset.w || '0';
      if (reduce) { f.style.width = w + '%'; return; }
      f.style.transition = 'none'; f.style.width = '0%';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        f.style.transition = ''; f.style.width = w + '%';
      }));
    });
  }
  function animateLoadBar(el){
    const bar = el.querySelector('#loadbar'), rest = el.querySelector('#loadrest');
    if (!bar || !rest) return;
    if (reduce) { bar.textContent = '####################'; rest.textContent = ''; return; }
    bar.textContent = ''; rest.textContent = '####################';
    let i = 0;
    const iv = setInterval(() => {
      i++;
      bar.textContent = '#'.repeat(i);
      rest.textContent = '#'.repeat(Math.max(0, 20 - i));
      if (i >= 20) clearInterval(iv);
    }, 55);
  }
  function play(el){
    if (!reduce) { el.classList.remove('is-active'); void el.offsetWidth; el.classList.add('is-active'); }
    animateCounters(el); animateBars(el); animateLoadBar(el);
  }

  function go(i){
    i = Math.max(0, Math.min(SLIDES.length - 1, i));
    slides[cur].classList.remove('is-active');
    cur = i;
    slides[cur].classList.add('is-active');
    railfill.style.width = ((cur + 1) / SLIDES.length * 100) + '%';
    countEl.textContent = (cur + 1) + ' / ' + SLIDES.length;
    whoEl.textContent = SLIDES[cur].who;
    labelEl.textContent = SLIDES[cur].nav;
    document.body.classList.toggle('show-help', cur === 0);
    play(slides[cur]);
    if (window.innerWidth <= 820) window.scrollTo(0, 0);
  }
  function next(){ if (cur < SLIDES.length - 1) { startClock(); go(cur + 1); } }
  function prev(){ go(cur - 1); }
  function openJump(){ jump.classList.add('open'); const b = jumplist.querySelector('button'); if (b) b.focus(); }
  function closeJump(){ jump.classList.remove('open'); }

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (jump.classList.contains('open')) {
      if (k === 'Escape' || k === 'o' || k === 'O') { e.preventDefault(); closeJump(); }
      return;
    }
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); prev(); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(SLIDES.length - 1); }
    else if (k === 'o' || k === 'O' || k === 'Escape') { e.preventDefault(); openJump(); }
    else if (k === 'r' || k === 'R') { e.preventDefault(); play(slides[cur]); }
    else if (k === 't' || k === 'T') { e.preventDefault(); resetClock(); }
    else if (k === 'f' || k === 'F') {
      e.preventDefault();
      if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen(); }
      else { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{}); }
    }
    else if (/^[1-9]$/.test(k)) { e.preventDefault(); startClock(); go(parseInt(k, 10) - 1); }
  });

  deck.addEventListener('click', e => {
    if (window.getSelection && String(window.getSelection())) return;
    if (e.target.closest('a, button, pre')) return;
    next();
  });

  let tsx = null;
  deck.addEventListener('touchstart', e => { tsx = e.changedTouches[0].clientX; }, {passive:true});
  deck.addEventListener('touchend', e => {
    if (tsx === null) return;
    const dx = e.changedTouches[0].clientX - tsx; tsx = null;
    if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); }
  }, {passive:true});

  jump.addEventListener('click', e => { if (e.target === jump) closeJump(); });

  go(0);
})();
</script>
</body></html>
